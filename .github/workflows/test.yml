name: Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # secret_pbcopy_test.rb runs the real JavaScript through osascript.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: rake test
