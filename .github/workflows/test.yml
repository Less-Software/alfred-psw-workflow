name: Test

on:
  push:
    branches: [ "main" ] # the README badge shows main's status
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # secret_pbcopy_test.rb runs the real JavaScript through osascript.
    runs-on: macos-latest
    strategy:
      matrix:
        ruby-version: [ '3.4', '4.0' ]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: rake test
